aid: endless-west
name: Endless West
description: 'Endless West is a Detroit-based molecular spirits manufacturer that applies food and
  molecular science to create alcoholic beverages without traditional distilling or aging. The company
  operates a TTB-approved production facility offering bulk base spirits and ready-to-bottle liquids,
  turnkey and private-label packaged brands, pre-made concentrates, and contract co-packing and bottling
  services for other brands and entrepreneurs. Its proprietary Glyph Molecular Spirit showcases a
  sustainability approach that reduces water usage and CO2 footprint versus conventional distillation.
  Endless West is a consumer-products and manufacturing company with no public developer API surface;
  this profile was surfaced as a Partech portfolio company and enriched into the API Evangelist network.'
